name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# GitHub Pages is reserved for the vocab site (see deploy-pages.yml). The
# Playwright report is kept as a downloadable workflow artifact instead.
permissions:
  contents: read

jobs:
  unit-and-component:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Prepare Nuxt
        run: npx nuxt prepare
        working-directory: web

      - name: Run unit tests
        run: pnpm --filter @prez-lite/web test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Prepare Nuxt
        run: npx nuxt prepare
        working-directory: web

      - name: Run integration tests
        run: pnpm --filter @prez-lite/web test:integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build vocabulary data
        run: pnpm build:all-export

      - name: Generate static site
        run: npx nuxt generate
        working-directory: web
        env:
          NUXT_PUBLIC_GITHUB_REPO: Kurrawong/prez-lite
          NUXT_PUBLIC_GITHUB_BRANCH: main
          NUXT_PUBLIC_GITHUB_VOCAB_PATH: data/vocabs
          NUXT_PUBLIC_GITHUB_CLIENT_ID: e2e-mock-client-id
          NUXT_PUBLIC_GITHUB_AUTH_WORKER_URL: http://localhost:9999

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run E2E tests
        run: pnpm --filter @prez-lite/web test:e2e

      - name: Upload Playwright report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30
