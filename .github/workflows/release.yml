name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: '🏷️ Release Please — Automated version bump & changelog'
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  RELEASE PLEASE                                            ║"
          echo "║                                                            ║"
          echo "║  Analyses conventional commits since the last release and   ║"
          echo "║  creates/updates a release PR with version bump +          ║"
          echo "║  CHANGELOG. Merging that PR creates a GitHub Release +     ║"
          echo "║  git tag.                                                  ║"
          echo "║                                                            ║"
          echo "║  Trigger: push to main                                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Tags created with GITHUB_TOKEN don't trigger other workflows, so publish
  # the versioned Docker image from here when a release is cut.
  docker:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
