# nginx configuration for the prez-lite container.
#
# Runs unprivileged: listens on 8080 and keeps all runtime state in /tmp, so the
# container also works with a read-only root filesystem (plus a /tmp tmpfs).
#
#   /usr/share/prez-lite/site   static Nuxt site (built into the image)
#   /srv/prez-lite/export       vocabulary exports (generated from /data at start-up)

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    # Relative redirects keep working behind port mappings and reverse proxies
    absolute_redirect off;

    charset utf-8;
    charset_types text/css text/plain text/xml text/csv text/turtle
                  application/javascript application/json application/ld+json
                  application/rdf+xml application/n-triples;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml text/csv text/turtle
               application/javascript application/json application/ld+json
               application/rdf+xml application/n-triples application/xml image/svg+xml;

    # Export caching mirrors web/public/_headers
    map $uri $export_cache_control {
        ~^/export/system/  "public, max-age=300";
        default            "public, max-age=3600";
    }

    server {
        listen 8080 default_server;
        server_name _;

        root /usr/share/prez-lite/site;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Site pages. Prerendered routes live at <route>/index.html; anything
        # else (e.g. /share/<vocab>) falls back to Nuxt's SPA shell.
        location / {
            include /etc/nginx/prez-lite/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/index.html $uri.html /200.html;
        }

        # Content-hashed build assets: cache forever, and 404 (not the SPA
        # shell) when missing so a stale client reloads cleanly.
        location ^~ /_nuxt/ {
            include /etc/nginx/prez-lite/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Vocabulary exports: open for machine consumption and cross-origin
        # embedding.
        location ^~ /export/ {
            alias /srv/prez-lite/export/;

            types {
                text/html               html;
                application/json        json;
                application/ld+json     jsonld;
                text/turtle             ttl;
                application/rdf+xml     rdf xml;
                application/n-triples   nt;
                text/csv                csv;
            }

            include /etc/nginx/prez-lite/security-headers.conf;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Cache-Control $export_cache_control always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            # Hide bookkeeping files such as .prez-lite-fingerprint
            location ~ /\. {
                return 404;
            }
        }

        # Embeddable web components
        location ^~ /web-components/ {
            include /etc/nginx/prez-lite/security-headers.conf;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Cache-Control "public, max-age=86400" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
            try_files $uri =404;
        }

        location ~ /\. {
            return 404;
        }
    }
}
